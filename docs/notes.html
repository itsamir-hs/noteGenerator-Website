            color: #7b8794;
        }

        footer {
            margin-top: 28px;

            font-size: 13px;
            color: #7b8794;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #14161a;
                color: #e6e8ec;
            }

            p.subtitle,
            .noteMeta,
            footer {
                color: #9aa4b2;
            }

            a {
                border-color: #2a2f37;
                background: #1c1f24;

            }
